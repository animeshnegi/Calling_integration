# Include INSIDE the existing HTTPS server {} serving the softphone's web host.
# Host nginx topology: Asterisk publishes 127.0.0.1:8088:8088 in docker-compose.yml.
# Do not include at http{} scope, create another vhost, or expose /ari or /http.
location = /ws {
    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Explicitly preserve the SIP subprotocol (normally forwarded by default).
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
