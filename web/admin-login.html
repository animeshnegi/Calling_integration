<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telephony Admin Login</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f7fb;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#fff;padding:32px;max-width:380px;width:calc(100% - 40px);border-radius:14px;box-shadow:0 10px 35px #0001}h1{margin-top:0}label{display:block;margin:16px 0 6px;font-weight:600}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd3df;border-radius:8px}button{width:100%;padding:12px;margin-top:20px;border:0;border-radius:8px;background:#182230;color:#fff;font-weight:700;cursor:pointer}.error{color:#b42318;margin-top:14px;min-height:20px}</style></head>
<body><main class="card"><h1>Telephony Admin</h1><p>Sign in to manage extensions, numbers, providers and call settings.</p>
<form id="login"><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button>Sign in</button><div id="error" class="error"></div></form></main>
<script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});if(r.ok)location='/admin';else document.querySelector('#error').textContent=(await r.json()).error||'Login failed';});</script></body></html>
