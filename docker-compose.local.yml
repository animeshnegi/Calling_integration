# Optional local/testing override. Use it TOGETHER with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# The base file is already standalone (all networks are local bridges), so this
# override only adds a throwaway MySQL for machines that have no database:
#
# Set DATABASE_URI in .env BEFORE running Compose (base-file validation requires it):
#   DATABASE_URI=mysql+pymysql://eip:eip-local-password@mysql:3306/telephony?charset=utf8mb4
# Then run:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml \
#       --profile bundled-db up --build
#
# For an existing MySQL on this machine, host-gateway resolves it from Docker:
#   DATABASE_URI=mysql+pymysql://root:PASSWORD@host.docker.internal:3306/telephony?charset=utf8mb4
#
# For a managed/remote MySQL, point DATABASE_URI at that host directly.
# Never use the bundled database in production.

services:
  mysql:
    image: mysql:8.4
    container_name: telephony-local-mysql
    # Opt-in only: started with --profile bundled-db. Never use in production.
    profiles: ["bundled-db"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: telephony
      MYSQL_USER: eip
      MYSQL_PASSWORD: eip-local-password
      MYSQL_ROOT_PASSWORD: eip-local-root-password
    networks:
      - data-network
    volumes:
      - mysql_local_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-peip-local-root-password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_local_data:
