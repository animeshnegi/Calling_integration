# Optional override for an existing MySQL Docker container (e.g. 1Panel).
#
# Use only when DATABASE_URI points to a MySQL container hostname such as
# 1Panel-mysql-H8JJ. Set MYSQL_DOCKER_NETWORK in .env and include this file:
#
#   MYSQL_DOCKER_NETWORK=1panel-network
#   COMPOSE_FILE=docker-compose.yml:docker-compose.local.yml
#
# XAMPP on Windows, host-installed MySQL, and managed/remote MySQL do NOT need
# this override. Leave MYSQL_DOCKER_NETWORK and COMPOSE_FILE blank/unset and
# run docker compose with docker-compose.yml alone.
#
# This override attaches only the API and ARI worker to the existing database
# network. Asterisk remains isolated on telephony-internal.

services:
  telephony-api:
    networks:
      - telephony-internal
      - data-network
      - mysql-existing-network

  telephony-ari:
    networks:
      - telephony-internal
      - data-network
      - mysql-existing-network

networks:
  mysql-existing-network:
    external: true
    name: ${MYSQL_DOCKER_NETWORK:?Set MYSQL_DOCKER_NETWORK when using an existing Docker MySQL network}
