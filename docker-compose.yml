# Bound Docker logs prevent SIP noise, health checks, or application errors from
# filling the VM disk. Limits apply per container and require container recreation.
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  telephony-api:
    image: engineerip/telephony-api:${IMAGE_TAG:-latest}
    build: .
    container_name: engineerip-telephony-api
    restart: unless-stopped
    logging: *bounded-logging
    env_file: .env
    # Cap the container so a crash-restart loop or a runaway worker can never
    # starve the host: boots are CPU-heavy (imports + password hashing), and
    # without a limit each restart burns every available core.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    # Docker Desktop resolves this automatically; host-gateway also makes it
    # work on modern Linux Docker when MySQL runs on the Docker host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URI: ${DATABASE_URI:?Set DATABASE_URI to your MySQL connection URI}
      SETTINGS_DB_PATH: /app/instance/settings.db
      CALLS_DB_PATH: /app/instance/calls.db
      ARI_READY_PATH: /app/instance/ari.ready
      ASTERISK_DYNAMIC_CONFIG_PATH: /app/asterisk-config/pjsip.dynamic.conf
      VOICEMAIL_PATH: /app/voicemail
      VOICEMAIL_CONTEXT: engineerip
    depends_on:
      asterisk:
        condition: service_healthy
      telephony-ari:
        condition: service_started
    networks:
      - crm-network
      - telephony-internal
      - mysql-network
    # Expose the Flask admin/API only on the local host.
    # Use a reverse proxy for remote access instead of publishing it publicly.
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - telephony_data:/app/instance
      - asterisk_dynamic_config:/app/asterisk-config
      - asterisk_voicemail:/app/voicemail
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

  telephony-ari:
    image: engineerip/telephony-api:${IMAGE_TAG:-latest}
    build: .
    container_name: engineerip-telephony-ari
    restart: unless-stopped
    logging: *bounded-logging
    env_file: .env
    # Single-process event worker; it never needs more than one core.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    # Docker Desktop resolves this automatically; host-gateway also makes it
    # work on modern Linux Docker when MySQL runs on the Docker host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URI: ${DATABASE_URI:?Set DATABASE_URI to your MySQL connection URI}
      SETTINGS_DB_PATH: /app/instance/settings.db
      CALLS_DB_PATH: /app/instance/calls.db
      ARI_READY_PATH: /app/instance/ari.ready
      ASTERISK_DYNAMIC_CONFIG_PATH: /app/asterisk-config/pjsip.dynamic.conf
    depends_on:
      asterisk:
        condition: service_healthy
    networks:
      - crm-network
      - telephony-internal
      - mysql-network
    volumes:
      - telephony_data:/app/instance
      - asterisk_dynamic_config:/app/asterisk-config
      - asterisk_voicemail:/app/voicemail
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    command: ["python", "-m", "app.ari_worker"]

  asterisk:
    image: engineerip/asterisk:${IMAGE_TAG:-latest}
    build: ./asterisk
    container_name: engineerip-asterisk
    restart: unless-stopped
    logging: *bounded-logging
    env_file: .env
    environment:
      ARI_USER: ${ASTERISK_ARI_USER:?ASTERISK_ARI_USER must be set in .env}
      ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:?ASTERISK_ARI_PASSWORD must be set in .env}
      AMI_USER: ${ASTERISK_AMI_USER:?ASTERISK_AMI_USER must be set in .env}
      AMI_PASSWORD: ${ASTERISK_AMI_PASSWORD:?ASTERISK_AMI_PASSWORD must be set in .env}
    volumes:
      # Static configuration ships with the image. Do not persist /etc/asterisk
      # as a volume or image updates would be hidden by the old volume contents.
      - asterisk_dynamic_config:/etc/asterisk/dynamic
      - asterisk_lib:/var/lib/asterisk
      - asterisk_spool:/var/spool/asterisk
      - asterisk_recordings:/var/spool/asterisk/recording
      - asterisk_voicemail:/var/spool/asterisk/voicemail
      - asterisk_keys:/etc/asterisk/keys
    networks:
      - telephony-internal
    ports:
      - "5060:5060/udp"
      # Must match Asterisk's rtp.conf - the entrypoint renders it from the
      # same two variables, so published ports and RTP range cannot drift.
      - "${ASTERISK_RTP_START:-10000}-${ASTERISK_RTP_END:-10100}:${ASTERISK_RTP_START:-10000}-${ASTERISK_RTP_END:-10100}/udp"
    security_opt:
      - no-new-privileges:true
    # Asterisk file logs are intentionally ephemeral; durable operational logs
    # are emitted to stderr/stdout and bounded by the Docker logging policy.
    tmpfs:
      - /var/log/asterisk:rw,noexec,nosuid,size=32m
      - /var/run/asterisk:rw,noexec,nosuid,size=4m
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show version' >/dev/null 2>&1 && asterisk -rx 'pjsip show transports' 2>/dev/null | grep -q 'transport-udp'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  crm-network:
    external: true
    name: crm-network

  telephony-internal:
    driver: bridge
    name: engineerip-telephony-internal
  mysql-network:
    external: true
    name: 1panel-network


volumes:
  telephony_data:
  asterisk_dynamic_config:
  asterisk_recordings:
  asterisk_voicemail:
  asterisk_lib:
  asterisk_spool:
  asterisk_keys:
