services:
  telephony-api:
    build: .
    container_name: engineerip-telephony-api
    restart: unless-stopped
    env_file: .env
    environment:
      SETTINGS_DB_PATH: /app/instance/settings.db
      CALLS_DB_PATH: /app/instance/calls.db
      ASTERISK_DYNAMIC_CONFIG_PATH: /app/asterisk-config/pjsip.dynamic.conf
    depends_on:
      asterisk:
        condition: service_healthy
    networks:
      - crm-network
      - telephony-internal
    volumes:
      - telephony_data:/app/instance
      - asterisk_dynamic_config:/app/asterisk-config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

  telephony-ari:
    build: .
    container_name: engineerip-telephony-ari
    restart: unless-stopped
    env_file: .env
    environment:
      SETTINGS_DB_PATH: /app/instance/settings.db
      CALLS_DB_PATH: /app/instance/calls.db
      ASTERISK_DYNAMIC_CONFIG_PATH: /app/asterisk-config/pjsip.dynamic.conf
    depends_on:
      asterisk:
        condition: service_healthy
    networks:
      - crm-network
      - telephony-internal
    volumes:
      - telephony_data:/app/instance
      - asterisk_dynamic_config:/app/asterisk-config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    command: ["python", "-m", "app.ari_worker"]

  asterisk:
    build: ./asterisk
    container_name: engineerip-asterisk
    restart: unless-stopped
    env_file: .env
    environment:
      ARI_USER: ${ASTERISK_ARI_USER:?ASTERISK_ARI_USER must be set in .env}
      ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:?ASTERISK_ARI_PASSWORD must be set in .env}
      AMI_USER: ${ASTERISK_AMI_USER:?ASTERISK_AMI_USER must be set in .env}
      AMI_PASSWORD: ${ASTERISK_AMI_PASSWORD:?ASTERISK_AMI_PASSWORD must be set in .env}
    volumes:
      - asterisk_etc:/etc/asterisk
      - asterisk_dynamic_config:/etc/asterisk/dynamic
      - asterisk_lib:/var/lib/asterisk
      - asterisk_spool:/var/spool/asterisk
      - asterisk_recordings:/var/spool/asterisk/recording
      - asterisk_keys:/etc/asterisk/keys
    networks:
      - telephony-internal
    ports:
      - "5060:5060/udp"
      - "${ASTERISK_RTP_START:?ASTERISK_RTP_START must be set}-${ASTERISK_RTP_END:?ASTERISK_RTP_END must be set}:${ASTERISK_RTP_START:?ASTERISK_RTP_START must be set}-${ASTERISK_RTP_END:?ASTERISK_RTP_END must be set}/udp"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show version' >/dev/null 2>&1 && asterisk -rx 'pjsip show endpoint ${DEFAULT_EXTENSION:-101}' >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  crm-network:
    external: true
    name: crm-network
  telephony-internal:
    driver: bridge
    name: engineerip-telephony-internal

volumes:
  telephony_data:
  asterisk_dynamic_config:
  asterisk_recordings:
  asterisk_etc:
  asterisk_lib:
  asterisk_spool:
  asterisk_keys:
