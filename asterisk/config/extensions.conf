[general]
static=yes
autofallthrough=yes

[globals]

[from-internal]
exten => _1XX,1,NoOp(EngineerIP extension ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Local numbers can be normalized by the integration service before reaching this context.
exten => _+X.,1,NoOp(Outbound E.164 ${EXTEN})
 same => n,Dial(PJSIP/provider/sip:${EXTEN},60)
 same => n,Hangup()

[web-outbound]
exten => _+X.,1,NoOp(WebRTC outbound ${EXTEN})
 same => n,Dial(PJSIP/provider/sip:${EXTEN},60)
 same => n,Hangup()

[from-provider]
exten => s,1,NoOp(Inbound provider call ${CALLERID(all)})
 same => n,Dial(PJSIP/101,30)
 same => n,Hangup()
