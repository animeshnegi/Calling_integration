[global]
user_agent=EngineerIP-Telephony

; ---------- UDP SIP transport for IP phones / softphones ----------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---------- TLS/WSS transport for browser WebRTC ----------
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

; ---------- Extension 101 example ----------
[101]
type=aor
max_contacts=5
remove_existing=yes

[101]
type=auth
auth_type=userpass
username=101
password=CHANGE-ME-101

[101]
type=endpoint
aors=101
auth=101
context=from-internal
disallow=all
allow=opus,ulaw,alaw
transport=transport-udp
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

; ---------- WebRTC endpoint template ----------
[webrtc-template](!)
type=endpoint
context=from-internal
disallow=all
allow=opus,ulaw,alaw
aors=dynamic
transport=transport-wss
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
webrtc=yes
timers=yes

; Example browser user 101-web
[101-web]
type=aor
max_contacts=2
remove_existing=yes

[101-web]
type=auth
auth_type=userpass
username=101-web
password=CHANGE-ME-WEB-101

[101-web](webrtc-template)
aors=101-web
auth=101-web

; ---------- SIP provider trunk template ----------
; Replace host/auth details via your provider. Do not commit real credentials.
[provider]
type=endpoint
transport=transport-udp
context=from-provider
disallow=all
allow=ulaw,alaw
outbound_auth=provider-auth
aors=provider-aor
direct_media=no

[provider-auth]
type=auth
auth_type=userpass
username=CHANGE-ME
password=CHANGE-ME

[provider-aor]
type=aor
contact=sip:provider.example.com
qualify_frequency=60

[provider-identify]
type=identify
endpoint=provider
match=provider.example.com
