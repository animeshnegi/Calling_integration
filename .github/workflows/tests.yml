name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Install real proxy test dependency
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Run pytest
        run: |
          set -o pipefail
          NGINX_BIN=/usr/sbin/nginx PYTHONPATH=. pytest -q -rA 2>&1 | tee pytest-output.txt
      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          if-no-files-found: error
          retention-days: 7

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - name: Exercise real MySQL startup, upgrades, CRUD and concurrency
        env:
          TEST_MYSQL_URI: mysql+pymysql://root:integration-only-password@127.0.0.1:3306/?charset=utf8mb4
        run: PYTHONPATH=. pytest -q -ra tests/integration/test_mysql_live.py
