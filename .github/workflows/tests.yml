name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate XAMPP/host MySQL Compose configuration
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose config --quiet
      - name: Validate 1Panel external MySQL network override
        env:
          MYSQL_DOCKER_NETWORK: existing-mysql
          COMPOSE_FILE: docker-compose.yml:docker-compose.local.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose config --format json > /tmp/compose.json
          python - <<'PY'
          import json
          with open("/tmp/compose.json", encoding="utf-8") as handle:
              config = json.load(handle)
          services = config["services"]
          api = set(services["telephony-api"]["networks"])
          ari = set(services["telephony-ari"]["networks"])
          asterisk = set(services["asterisk"]["networks"])
          assert "mysql-existing-network" in api
          assert "mysql-existing-network" in ari
          assert "mysql-existing-network" not in asterisk
          assert api == ari
          assert asterisk == {"telephony-internal"}
          PY

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: |
          set -o pipefail
          PYTHONPATH=. pytest -q -rA 2>&1 | tee pytest-output.txt
      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          if-no-files-found: error
          retention-days: 7
