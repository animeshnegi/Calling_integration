name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production and local Compose definitions
        # Placeholder values only; do not start services or contact a database.
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose config --quiet
          MYSQL_DOCKER_NETWORK=existing-mysql docker compose -f docker-compose.yml -f docker-compose.mysql-network.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.local.yml --profile bundled-db config --quiet

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: |
          set -o pipefail
          PYTHONPATH=. pytest -q -rA 2>&1 | tee pytest-output.txt
      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          if-no-files-found: error
          retention-days: 7
